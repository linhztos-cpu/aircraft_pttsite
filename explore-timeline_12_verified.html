<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事故 × 制度 雙軌時間軸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET & BASE — 8-bit／像素遊戲風格
   ============================================================ */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #DCEEF9 0%, #EAF1EC 55%, #F3F0E6 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-weight: 700; margin: 0 0 0.6em; letter-spacing: 0.01em; }
p { margin: 0 0 1em; }
a { color: var(--institute); }
a:hover { color: var(--accident); }
img, svg { max-width: 100%; }
button { font-family: inherit; }

:root {
  --bg: #eaf3f7;
  --bg-panel: #F3EFE4;
  --bg-panel-2: #FAF8F2;
  --chart-bg: #FFFFFF;
  --ink: #2E2B24;
  --ink-soft: #6E6858;
  --ink-faint: #ACA48F;
  --accident: #D14B3F;
  --accident-soft: #f6c3bc;
  --institute: #2670AC;
  --institute-soft: #b7d7ec;
  --law: #B9862A;
  --law-soft: #ecd7a8;
  --gov: #34835A;
  --gov-soft: #b9dcc6;
  --intl: #7C55AE;
  --intl-soft: #d6c6e8;
  --line: #CBC2AA;
  --line-soft: #E7E1D2;
  --inactive: #d8d2c0;
  --focus: #1a5276;
  --header-h: 168px;
  --serif: Georgia, "Noto Serif TC", "PingFang TC", serif;
  --pixel: "Press Start 2P", "DotGothic16", monospace;
  --pixel-cn: "DotGothic16", "Press Start 2P", monospace;
  --pixel-border: #34312A;
  --pixel-shadow: #1c1a15;
  --pixel-yellow: #C98A2E;
}
@media (max-width: 720px) { :root { --header-h: 210px; } }

/* 像素風的方角按鈕：粗邊框＋硬邊實色陰影，按下時陰影收起、按鈕位移 */
.pixel-btn {
  border: 3px solid var(--pixel-border);
  border-radius: 3px;
  box-shadow: 3px 3px 0 var(--pixel-border);
  transition: transform .08s steps(1), box-shadow .08s steps(1);
}
.pixel-btn:hover { filter: brightness(1.06); }
.pixel-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--pixel-border); }
@media (prefers-reduced-motion: reduce) { .pixel-btn { transition: none; } }

.skip-link {
  position: absolute; left: 8px; top: -60px;
  background: var(--pixel-border); color: #fff;
  padding: 10px 16px; z-index: 999;
  font-family: var(--pixel-cn); font-size: 12px;
  transition: top .2s ease;
}
.skip-link:focus { top: 8px; }
*:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ============================================================
   LEGEND (shared)
   ============================================================ */
.legend {
  display: flex; flex-wrap: wrap; align-items:center; gap: 9px 22px;
  font-size: 12.5px; color: var(--ink-soft);
  padding: 11px 14px;
  margin-top: 10px;
  background: var(--bg-panel);
  border: 2px solid var(--pixel-border);
  border-radius: 3px;
  box-shadow: 3px 3px 0 var(--pixel-border);
}
.legend .grp { display:flex; align-items:center; gap: 8px 18px; flex-wrap: wrap; }
.legend .sep { width: 2px; height: 14px; background: var(--pixel-border); margin: 0 4px; opacity: .35; }
.legend-item { display: flex; align-items: center; gap: 7px; white-space: nowrap; letter-spacing: .01em; }
.legend-shape-svg { width: 15px; height: 15px; flex: none; display:inline-block; overflow: visible; }
.legend-line { width: 24px; height: 0; border-top: 3px solid var(--ink-soft); flex:none; }
.legend-line.dashed { border-top-style: dashed; }
.legend-line.none { border-top: 3px dotted var(--inactive); }
.stage-sticky > .legend { flex: none; margin: 12px 0 0; }
@media (max-width: 720px) { .legend .sep { display:none; } }

/* ============================================================
   STAGE MARKERS：純捲動觸發用的隱形間隔欄，提供捲動長度與
   IntersectionObserver 觀察目標，不再參與版面視覺呈現
   （視覺呈現統一收進下方的 .frame 單一畫框）。
   ============================================================ */
.stage-markers-track { width: 100%; }
.stage-marker { min-height: 84vh; }

/* ============================================================
   FRAME：把標題／圖例／年份目錄／圖表全部收進同一個畫框，
   桌機固定在視窗中央（inset fixed），隨捲動更新內容但畫框本身不動；
   手機則還原成一般文件流（見下方 max-width:880px）。
   ============================================================ */
.frame {
  position: fixed;
  top: 22px; left: 22px; right: 22px; bottom: 22px;
  z-index: 20;
  background: var(--bg-panel-2);
  border: 4px solid var(--pixel-border);
  border-radius: 6px;
  box-shadow: 6px 6px 0 var(--pixel-shadow), 0 30px 70px -30px rgba(28,27,24,0.35);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.frame-header { flex: none; padding: 22px 28px 0; position: relative; }
.frame-header h1 {
  font-family: var(--pixel-cn);
  font-size: clamp(20px, 2.6vw, 28px);
  font-weight: 400;
  letter-spacing: 0.02em;
  margin-bottom: 4px;
  color: #fff;
  text-shadow:
    2px 0 0 var(--pixel-border), -2px 0 0 var(--pixel-border),
    0 2px 0 var(--pixel-border), 0 -2px 0 var(--pixel-border),
    2px 2px 0 var(--pixel-border), -2px -2px 0 var(--pixel-border),
    2px -2px 0 var(--pixel-border), -2px 2px 0 var(--pixel-border);
}
.frame-header .kicker {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--pixel);
  font-size: 12px; letter-spacing: 0.06em;
  color: var(--accident); font-weight: 400; margin-bottom: 12px;
}
.frame-header .kicker::before {
  content: '▶▶▶'; display:inline-block; color: var(--pixel-yellow, #e0a92e); letter-spacing: -1px;
}

.frame-body {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 230px 1fr;
  grid-template-rows: minmax(0, 1fr);
  align-items: stretch;
  gap: 20px;
  padding: 22px 30px 38px;
}

/* 圖表要撐滿右側整個欄位（寬與高都撐滿），是畫面上最大的物件；
   SVG 本身用 preserveAspectRatio 依可用空間等比縮放到最大。 */
.stage-viz-wrap { position: relative; min-width: 0; height: 100%; max-height: 100%; display:flex; box-sizing: border-box; }
.stage-sticky {
  position: relative;
  width: 100%; min-width: 0; height: 100%; max-height: 100%; display:flex; flex-direction:column; box-sizing: border-box;
  background: var(--chart-bg);
  border: 3px solid var(--pixel-border);
  border-radius: 6px;
  box-shadow: 4px 4px 0 var(--pixel-shadow);
  padding: 18px 22px 14px;
}
.stage-viz-scroll {
  overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
  min-width: 0; flex: 1; min-height: 0; display:flex;
}
#stageViz { width:100%; height:100%; display:block; shape-rendering: crispEdges; }
.stage-viz-hint { display:none; font-family: var(--pixel-cn); font-size: 11px; color: var(--ink-soft); text-align:center; margin-top: 10px; letter-spacing:.02em; }
.track-label {
  font-size: 13px; font-weight: 600; fill: var(--ink-soft);
  letter-spacing: .04em;
}

/* 提示：可以向下滑動 —— 放在目錄下方，淡淡地常駐提示，不搶眼、無外匡 */
.scroll-hint {
  margin-top: 14px;
  padding: 4px 2px 0;
  color: var(--ink-faint);
  font-family: var(--pixel-cn); font-size: 11px; letter-spacing: .02em;
  display:flex; align-items:center; gap:7px;
  opacity: .68;
}
.scroll-hint .arrow { display:inline-block; color: var(--ink-faint); animation: bob 1.6s steps(2) infinite; }
@media (prefers-reduced-motion: reduce) { .scroll-hint .arrow { animation:none; } }
@keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(5px);} }

/* ============================================================
   READING TOC（左側年份目錄 + 閱讀進度）
   改用「編號徽章 + 卡片列」設計：每個年份是一列獨立的卡片，
   正在閱讀的那一列用強調色底＋左側色條＋放大年份凸顯；
   已讀過的列徽章打勾、淡化；尚未讀到的列維持中性樣式。
   桌機：固定高度、可捲動的清單。手機：一般文件流中的卡片區塊。
   ============================================================ */
.reading-toc {
  max-width: 250px;
  max-height: 100%;
  overflow-y: auto;
  padding-right: 2px;
}
.reading-toc-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.reading-toc-item { position: relative; }
.reading-toc-btn {
  display:flex; align-items:center; gap:12px;
  background: var(--bg-panel-2);
  border: 2px solid var(--line-soft);
  border-left: 5px solid transparent;
  border-radius: 5px;
  cursor:pointer; text-align:left;
  padding: 9px 12px; width:100%; min-height:34px;
  transition: background-color .3s ease, border-color .3s ease, transform .2s ease;
}
.reading-toc-btn:hover { border-color: var(--institute-soft); transform: translateX(1px); }
.reading-toc-btn .num {
  flex: none; width:26px; height:26px; display:flex; align-items:center; justify-content:center;
  font-family: var(--pixel); font-size: 9px;
  background: var(--chart-bg); color: var(--ink-faint);
  border: 2px solid var(--line); border-radius: 4px;
  transition: all .3s ease;
}
.reading-toc-btn .txt-wrap { min-width: 0; }
.reading-toc-btn .yr {
  display:block;
  font-size: 12.5px; line-height: 1.4; color: var(--ink-soft); font-weight: 700;
  transition: font-size .35s cubic-bezier(.2,.7,.3,1), color .3s ease;
}
.reading-toc-btn .desc {
  display:block; font-size: 10.5px; line-height: 1.4; color: var(--ink-faint);
  margin-top: 2px; letter-spacing: .01em;
  overflow: hidden; max-height: 0; opacity: 0;
  transition: max-height .35s ease, opacity .3s ease, margin-top .3s ease;
}
/* 已讀過：徽章打勾＋淡化邊框，內容維持可讀但不搶眼 */
.reading-toc-item.is-past .reading-toc-btn { background: var(--bg-panel-2); border-color: var(--line-soft); }
.reading-toc-item.is-past .num {
  background: var(--gov-soft); border-color: var(--gov); color: var(--gov); font-size: 12px;
}
.reading-toc-item.is-past .yr { color: var(--ink-faint); font-weight: 600; }
/* 正在閱讀：整列強調色底、左側色條、年份放大，是清單中最醒目的一列 */
.reading-toc-item.is-current .reading-toc-btn {
  background: var(--accident-soft);
  border-color: var(--accident);
  border-left-color: var(--accident);
  box-shadow: 2px 2px 0 var(--pixel-border);
}
.reading-toc-item.is-current .num {
  background: var(--accident); border-color: var(--pixel-border); color: #fff;
}
.reading-toc-item.is-current .yr { font-size: 17px; color: var(--pixel-border); }
.reading-toc-item.is-current .desc {
  max-height: 60px; opacity: 1; margin-top: 4px; color: var(--ink-soft);
}
@media (prefers-reduced-motion: reduce) {
  .reading-toc-btn, .reading-toc-btn .num, .reading-toc-btn .yr, .reading-toc-btn .desc { transition: none; }
}

@media (max-width: 880px) {
  /* 手機版還原成一般文件流：.frame 與 .frame-body 用 display:contents
     "溶解"，讓標題／年份目錄／捲動觸發欄／圖表都變成 .scene 的直接
     grid 子項，用 grid-template-areas 排成「標題→目錄→（隱形欄＋圖表）」，
     不受畫框在桌機版的 DOM 巢狀限制，也不需要調整 HTML 結構。 */
  .scene {
    display: grid;
    grid-template-columns: 16px 1fr;
    grid-template-areas:
      "header header"
      "toc toc"
      "markers viz";
  }
  .frame { display: contents; }
  .frame-body { display: contents; }

  .frame-header {
    grid-area: header;
    position: sticky; top: 0; z-index: 30;
    background: var(--bg-panel-2); box-shadow: 0 3px 0 var(--pixel-border);
    padding: 18px 20px 14px;
  }
  .stage-markers-track { grid-area: markers; }
  .stage-viz-wrap { grid-area: viz; display: block; height: auto; }

  .reading-toc {
    grid-area: toc;
    max-width: none; max-height: none; overflow-y: visible;
    margin: 10px 10px 18px; padding: 12px;
    background: var(--bg-panel); border: 3px solid var(--pixel-border);
    border-radius: 6px; box-shadow: 3px 3px 0 var(--pixel-border);
  }
  .reading-toc-btn { padding: 8px 10px; gap: 10px; }
  .reading-toc-btn .num { width:22px; height:22px; font-size:8px; }
  .reading-toc-btn .yr { font-size: 11px; }
  .reading-toc-btn .desc { font-size: 10px; }
  .reading-toc-item.is-current .yr { font-size: 14px; }
  .reading-toc-item.is-current .desc { font-size: 11px; }
  .stage-marker { min-height: 74vh; }
  .stage-sticky {
    position: sticky; top: calc(var(--header-h) + 8px);
    background: var(--chart-bg); border: 3px solid var(--pixel-border);
    border-radius: 4px; box-shadow: 4px 4px 0 var(--pixel-shadow);
    padding: 18px 16px 14px; display: block; height: auto;
  }
  .stage-viz-scroll { min-width: 0; display:block; height:auto; }
  #stageViz { width: 900px; max-width: none; height: auto; }
  .stage-viz-hint { display:block; }
}

/* ============================================================
   TIMELINE NODE / EDGE STYLES
   ============================================================ */
.tl-edge { fill:none; stroke-width:2.5; transition: opacity .5s ease, stroke .3s ease; }
.tl-edge.level-direct { stroke: var(--institute); }
.tl-edge.level-background { stroke: var(--institute); stroke-dasharray: 7 5; }
.tl-edge.level-uncertain { stroke: var(--ink-faint); stroke-dasharray: 2 5; stroke-linecap: round; }
.tl-edge.is-current-step { animation: edge-step-reveal .42s ease-out both; }
@keyframes edge-step-reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}
.tl-node { cursor: pointer; transition: opacity .5s ease, transform .3s ease; }
.tl-node .shape { stroke: var(--pixel-border); stroke-width: 2; transition: filter .2s ease, stroke-width .2s ease; }
.tl-node.type-accident .shape { fill: var(--accident); }
.tl-node.type-institution .shape { fill: var(--institute); }
.tl-node.type-law .shape { fill: var(--law); }
.tl-node.type-governance .shape { fill: var(--gov); }
.tl-node.type-international .shape { fill: var(--intl); }
.tl-node.hidden-node { opacity: 0; pointer-events: none; }
.tl-node:hover .shape { filter: brightness(1.12); stroke-width: 3; }
.tl-node:focus { outline: none; }
.tl-node:focus-visible .shape { stroke: var(--focus); stroke-width: 3; }

/* 節點的「隱隱發光」提示：本體不動，外圍光暈同步收縮淡出，
   暗示這個圖示可以點擊查看詳情。 */
.node-glow {
  stroke: none; pointer-events: none;
  transform-box: fill-box; transform-origin: center;
  animation: node-glow-pulse 1.8s ease-out infinite;
}
.tl-node.type-accident .node-glow { fill: var(--accident); }
.tl-node.type-institution .node-glow { fill: var(--institute); }
.tl-node.type-law .node-glow { fill: var(--law); }
.tl-node.type-governance .node-glow { fill: var(--gov); }
.tl-node.type-international .node-glow { fill: var(--intl); }
@keyframes node-glow-pulse {
  0%   { transform: scale(2.8); opacity: 0; }
  55%  { transform: scale(1.15); opacity: .6; }
  100% { transform: scale(1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .node-glow { animation: none; opacity: .28; transform: scale(1.15); }
}
.tl-node .node-label {
  font-size: 12.5px; font-weight: 700; fill: var(--ink); pointer-events: none;
  paint-order: stroke; stroke: var(--chart-bg); stroke-width: 4px; stroke-linejoin: round;
}
.tl-node.type-accident .node-label { fill: var(--accident); font-weight: 700; }
.tl-year-axis line { stroke: var(--pixel-border); stroke-width: 2; }
.tl-year-axis text { font-size: 11px; font-family: var(--pixel); fill: var(--ink-soft); letter-spacing: 0; }

/* ============================================================
   DETAIL PANEL / BOTTOM SHEET
   ============================================================ */
.detail-overlay {
  position: fixed; inset: 0; background: rgba(20,20,20,0.35);
  z-index: 60; opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.detail-overlay.is-open { opacity: 1; pointer-events: auto; }
.detail-panel {
  position: fixed; top: 12px; right: 12px; bottom: 12px;
  width: min(420px, 92vw);
  background: var(--bg-panel-2); border: 4px solid var(--pixel-border);
  border-radius: 6px;
  box-shadow: -6px 6px 0 var(--pixel-shadow);
  z-index: 70; padding: 24px 22px 32px; overflow-y: auto;
  transform: translateX(calc(100% + 24px)); transition: transform .35s ease;
}
.detail-panel.is-open { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) { .detail-panel, .detail-overlay { transition: none; } }
.detail-close {
  position: absolute; top: 14px; right: 14px;
  background: var(--bg-panel); border: 2px solid var(--pixel-border);
  width: 40px; height: 40px; border-radius: 4px;
  box-shadow: 2px 2px 0 var(--pixel-border);
  font-size: 15px; cursor: pointer; line-height:1; color: var(--ink);
}
.detail-close:hover { color: var(--accident); }
.detail-close:active { transform: translate(2px,2px); box-shadow: none; }
.detail-type-tag {
  display: inline-block; font-family: var(--pixel); font-size: 10px; font-weight: 400; letter-spacing: .02em;
  padding: 6px 10px; border: 2px solid var(--pixel-border); border-radius: 3px; color: #fff; margin-bottom: 14px;
  box-shadow: 2px 2px 0 var(--pixel-border);
}
.detail-year { font-family: var(--pixel); font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; }
.detail-panel h3 {
  font-family: var(--pixel-cn);
  font-weight: 400;
  font-size: 16px; margin-bottom: 16px; line-height:1.7;
  color: var(--ink);
}
.detail-section { margin-bottom: 18px; }
.detail-section h4 {
  font-family: var(--pixel); font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-soft); margin-bottom: 8px;
}
.detail-section p { font-size: 14.5px; margin: 0; color: var(--ink); }
.causal-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-family: var(--pixel); font-size: 11px; font-weight: 400;
  padding: 7px 10px; border: 2px solid var(--pixel-border); border-radius: 3px; margin-bottom: 10px;
  box-shadow: 2px 2px 0 var(--pixel-border);
}
.causal-badge.level-direct { background: var(--accident-soft); color: var(--accident); }
.causal-badge.level-background { background: var(--institute-soft); color: var(--institute); }
.causal-badge.level-longterm { background: var(--gov-soft); color: var(--gov); }
.causal-badge.level-uncertain { background: var(--line-soft); color: var(--ink-soft); }
.sources-toggle {
  background: var(--bg-panel); border:2px solid var(--pixel-border); border-radius:3px;
  box-shadow: 2px 2px 0 var(--pixel-border);
  padding: 10px 14px; font-family: var(--pixel-cn); font-size: 12px; cursor:pointer; color: var(--ink); min-height: 44px;
}
.sources-toggle:active { transform: translate(2px,2px); box-shadow: none; }
.sources-list { margin-top: 10px; padding-left: 18px; font-size: 12.5px; color: var(--ink-soft); }
.sources-list li { margin-bottom: 6px; }
.sources-list[hidden] { display:none; }

@media (max-width: 640px) {
  .detail-panel {
    left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 82vh;
    border-radius: 8px; transform: translateY(calc(100% + 24px)); padding-top: 18px;
    box-shadow: -4px -4px 0 var(--pixel-shadow);
  }
  .detail-panel.is-open { transform: translateY(0); }
  .sheet-grabber { width: 40px; height: 4px; background: var(--pixel-border); border-radius: 2px; margin: 0 auto 14px; }
}


/* ============================================================
   FULL OVERVIEW MODE：不捲動也能看見完整時間軸
   ============================================================ */
html, body { width: 100%; height: 100%; overflow: hidden; }
.scene { width: 100%; height: 100vh; height: 100dvh; min-height: 0; display: block; }
.stage-markers-track { display: none !important; }
.frame {
  position: relative; inset: auto;
  width: calc(100% - 24px); height: calc(100vh - 24px); height: calc(100dvh - 24px);
  margin: 12px; display: flex; overflow: hidden;
}
.frame-body {
  width: 100%; height: 100%; min-height: 0; flex: 1;
  grid-template-columns: minmax(160px, 210px) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  gap: 14px; padding: 12px 14px 18px;
}
.reading-toc { max-width: 210px; max-height: 100%; }

function drawShape(type, cx, cy, size) {

  const minGap = o.compact ? 20 : 106;
  const rows = {};
  NODES.forEach(n => { const key = laneRowKey[n.type]; (rows[key] = rows[key] || []).push(n); });
  const nodeX = {};
  Object.keys(rows).forEach(key => {
    const arr = rows[key].slice().sort((a,b) => a.year - b.year).map(n => ({ id:n.id, x: scaleX(n.year, W, padL, padR) }));
    for (let i = 1; i < arr.length; i++) { if (arr[i].x - arr[i-1].x < minGap) arr[i].x = arr[i-1].x + minGap; }
    const overflow = arr.length ? arr[arr.length-1].x - (W - padR) : 0;
    if (overflow > 0) arr.forEach(a => { a.x -= overflow; });
    arr.forEach(a => { nodeX[a.id] = a.x; });
  });

  const axisY = H*0.90;
  const axisG = el('g', { class:'tl-year-axis' });
  axisG.appendChild(el('line', { x1:padL, x2:W-padR, y1:axisY, y2:axisY }));
  if (!o.compact) {
    for (let y = 1990; y <= 2025; y += 5) {
      const x = scaleX(y, W, padL, padR);
      const t = el('text', { x, y: axisY + 17, 'text-anchor':'middle' }); t.textContent = y; axisG.appendChild(t);
      axisG.appendChild(el('line', { x1:x, x2:x, y1:axisY-4, y2:axisY+4 }));
    }
  }
  svg.appendChild(axisG);

  if (!o.compact) {
    [[yAccident,'重大事故'],[yInst,'調查機構'],[yLaw,'法律規章'],[yGov,'治理制度'],[yIntl,'國際規範']].forEach(([y, text]) => {
      const t = el('text', { x: 4, y: y + 4, class:'track-label' }); t.textContent = text; svg.appendChild(t);
    });
  }

  function visible(item) {
    if (o.filterTypes && item.type && !o.filterTypes.has(item.type)) return false;
    if (o.revealStep !== null && item.step > o.revealStep) return false;
    return true;
  }

  const edgeG = el('g', { class:'edges' });
  EDGES.forEach(edge => {
    const fromN = NODE_MAP[edge.from], toN = NODE_MAP[edge.to];
    const showEdge = (o.filterTypes ? (o.filterTypes.has(fromN.type) && o.filterTypes.has(toN.type)) : true)
      && (o.revealStep === null ? true : edge.step <= o.revealStep);
    if (!showEdge) return;
    const x1 = nodeX[fromN.id], y1 = laneY[fromN.type];
    const x2 = nodeX[toN.id], y2 = laneY[toN.type];
    const midY = (y1 + y2) / 2;
    const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
    const meta = CAUSAL_META[edge.level];
    const isCurrentEdge = o.revealStep !== null && edge.step === o.revealStep;
    const path = el('path', {
      d,
      class: 'tl-edge ' + (meta.lineClass || '') + (isCurrentEdge ? ' is-current-step' : '')
    });
    if (!meta.lineClass) path.setAttribute('stroke', 'none');
    edgeG.appendChild(path);
  });
  svg.appendChild(edgeG);

  const nodeG = el('g', { class:'nodes' });
  NODES.forEach(n => {
    const show = visible(n);
    const x = nodeX[n.id], y = laneY[n.type];
    const g = el('g', {
      class: 'tl-node type-' + n.type + (show ? '' : ' hidden-node'),
      tabindex: (o.interactive && show) ? '0' : '-1',
      role: 'button',
      'aria-label': (TYPE_META[n.type].label) + '，' + n.yearLabel + '，' + n.title + '。按 Enter 或空白鍵查看詳細資料。',
    });
    if (!o.compact && show) {
      const glow = drawShape(n.type, x, y, nodeSize * 0.85);
      glow.setAttribute('class', 'node-glow');
      g.appendChild(glow);
    }
    g.appendChild(drawShape(n.type, x, y, nodeSize));
    if (!o.compact) {
      const rawLabelX = x + (n.labelDx || 0);
      const labelY = (n.type === 'accident' ? y - nodeSize - 6 : y + nodeSize + 14) + (n.labelDy || 0);
      const nearLeftEdge = rawLabelX < 105;
      const nearRightEdge = rawLabelX > W - 105;
      const labelX = nearLeftEdge ? 12 : nearRightEdge ? W - 12 : rawLabelX;
      const labelAnchor = nearLeftEdge ? 'start' : nearRightEdge ? 'end' : 'middle';
      const label = el('text', { x:labelX, y:labelY, class: 'node-label', 'text-anchor':labelAnchor });
      label.textContent = n.shortTitle;
      g.appendChild(label);
    }
    if (o.interactive) {
      g.addEventListener('click', () => openDetail(n.id));
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(n.id); } });
    }
    nodeG.appendChild(g);
  });
  svg.appendChild(nodeG);
}

function buildLegend(container) {
  container.innerHTML = '';
  container.setAttribute('role', 'group');
  container.setAttribute('aria-label', '圖例');

  const shapeGrp = document.createElement('div'); shapeGrp.className = 'grp';
  [['accident','重大事故'], ['institution','調查機構'], ['law','法律規章'], ['governance','治理制度'], ['international','國際規範']]
    .forEach(([type,label]) => {
      const item = document.createElement('span'); item.className='legend-item';
      const svg = el('svg', { class: 'legend-shape-svg', viewBox: '0 0 20 20', width: '15', height: '15', 'aria-hidden': 'true' });
      const g = el('g', { class: 'tl-node type-' + type });
      g.appendChild(drawShape(type, 10, 10, 15));
      svg.appendChild(g);
      item.appendChild(svg);
      const t = document.createElement('span'); t.textContent = label; item.appendChild(t);
      shapeGrp.appendChild(item);
    });
  container.appendChild(shapeGrp);

  const sep = document.createElement('span'); sep.className='sep'; container.appendChild(sep);

  const lineGrp = document.createElement('div'); lineGrp.className = 'grp';
  [['', '直接促成'], ['dashed', '間接形成改革背景']].forEach(([cls,label]) => {
    const item = document.createElement('span'); item.className='legend-item';
    const ln = document.createElement('span'); ln.className = 'legend-line ' + cls; item.appendChild(ln);
    const t = document.createElement('span'); t.textContent = label; item.appendChild(t);
    lineGrp.appendChild(item);
  });
  container.appendChild(lineGrp);
}
</script>

<script>
/* ============================================================
   SCROLLYTELLING（依年份 STEP 逐步展開，無文字敘事，純圖表）
   ============================================================ */
const STEP_LABELS = ['起點','1998','2000–2004','2011–2012','2011–2016','2019','今日'];
// 合併原本左側年份標記與右側目錄的文字內容，供 .reading-toc 使用
const TOC_ITEMS = [
  { year:'1998以前', desc:'尚無專責調查機關' },
  { year:'1998',      desc:'CI676與專責飛安會起步' },
  { year:'2000–2004', desc:'SQ006、CI611、GE791與調查法制化' },
  { year:'2011–2012', desc:'調查機關組織法制化' },
  { year:'2011–2016', desc:'SSP、Annex 19與系統風險' },
  { year:'2019',      desc:'改制國家運輸安全調查' },
  { year:'今日',      desc:'調查績效與飛安風險圖像' },
];

let currentStep = 0;

function setTimelineStep(stepIdx) {
  const lastStep = TOC_ITEMS.length - 1;
  currentStep = Math.max(0, Math.min(lastStep, stepIdx));
  const svg = document.getElementById('stageViz');
  renderTimeline(svg, { revealStep: currentStep, interactive: true });
  updateReadingToc(currentStep);
}

function initStages() {
  const surface = document.getElementById('frameBox');
  buildLegend(document.getElementById('legendMain'));
  setTimelineStep(0);

  let wheelLocked = false;
  let wheelUnlockTimer = null;
  function handleTimelineWheel(event) {
    if (event.ctrlKey || Math.abs(event.deltaY) < 0.5) return;
    if (document.querySelector('.detail-panel.is-open')) return;

    const direction = event.deltaY > 0 ? 1 : -1;
    const lastStep = TOC_ITEMS.length - 1;

    if ((direction < 0 && currentStep === 0) ||
        (direction > 0 && currentStep === lastStep)) {
      return;
    }

    event.preventDefault();
    if (wheelLocked) return;

    setTimelineStep(currentStep + direction);
    wheelLocked = true;
    window.clearTimeout(wheelUnlockTimer);
    wheelUnlockTimer = window.setTimeout(() => { wheelLocked = false; }, 260);
  }

  // 掛在視窗的擷取階段，確保游標位於 SVG、圖例或年份目錄上時都能收到滾輪事件。
  window.addEventListener('wheel', handleTimelineWheel, { passive: false, capture: true });

  let touchStartY = null;
  surface.addEventListener('touchstart', event => {
    if (event.touches.length === 1) touchStartY = event.touches[0].clientY;
  }, { passive: true });
  surface.addEventListener('touchend', event => {
    if (touchStartY === null || !event.changedTouches.length) return;
    const distance = touchStartY - event.changedTouches[0].clientY;
    touchStartY = null;
    if (Math.abs(distance) < 42) return;
    setTimelineStep(currentStep + (distance > 0 ? 1 : -1));
  }, { passive: true });

  surface.addEventListener('keydown', event => {
    if (event.key === 'ArrowDown' || event.key === 'PageDown') {
      event.preventDefault();
      setTimelineStep(currentStep + 1);
    } else if (event.key === 'ArrowUp' || event.key === 'PageUp') {
      event.preventDefault();
      setTimelineStep(currentStep - 1);
    } else if (event.key === 'Home') {
      event.preventDefault();
      setTimelineStep(0);
    } else if (event.key === 'End') {
      event.preventDefault();
      setTimelineStep(TOC_ITEMS.length - 1);
    }
  });

  surface.addEventListener('pointerenter', () => {
    surface.focus({ preventScroll: true });
  });
}
</script>

<script>
/* ============================================================
   READING TOC（合併版年份目錄，顯示閱讀進度）
   正在閱讀的項目文字放大＋變色；其餘項目縮小、淡化。
   ============================================================ */
function initReadingToc() {
  const list = document.getElementById('readingTocList');
  TOC_ITEMS.forEach((item, idx) => {
    const li = document.createElement('li');
    li.className = 'reading-toc-item';
    li.dataset.step = idx;
    const btn = document.createElement('button');
    btn.className = 'reading-toc-btn';
    btn.type = 'button';
    btn.setAttribute('aria-label', '跳到 ' + item.year + '：' + item.desc);
    const num = document.createElement('span'); num.className = 'num';
    num.textContent = String(idx + 1).padStart(2, '0');
    const wrap = document.createElement('span'); wrap.className = 'txt-wrap';
    const yr = document.createElement('span'); yr.className = 'yr'; yr.textContent = item.year;
    const desc = document.createElement('span'); desc.className = 'desc'; desc.textContent = item.desc;
    wrap.appendChild(yr); wrap.appendChild(desc);
    btn.appendChild(num); btn.appendChild(wrap);
    btn.addEventListener('click', () => {
      setTimelineStep(idx);
    });
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function updateReadingToc(stepIdx) {
  const items = document.querySelectorAll('.reading-toc-item');
  items.forEach(item => {
    const s = Number(item.dataset.step);
    const isPast = s < stepIdx;
    item.classList.toggle('is-current', s === stepIdx);
    item.classList.toggle('is-past', isPast);
    const num = item.querySelector('.num');
    if (num) num.textContent = isPast ? '✓' : String(s + 1).padStart(2, '0');
  });
}
</script>

<script>
/* ============================================================
   DETAIL PANEL
   ============================================================ */
let lastFocusedEl = null;

function openDetail(nodeId) {
  const n = NODE_MAP[nodeId];
  if (!n) return;
  lastFocusedEl = document.activeElement;

  const meta = TYPE_META[n.type];
  const tag = document.getElementById('detailTypeTag');
  tag.textContent = meta.label; tag.style.background = meta.color;

  document.getElementById('detailYear').textContent = n.yearLabel + (n.uncertain ? '（日期存在不確定性）' : '');
  document.getElementById('detailTitle').textContent = n.title;
  document.getElementById('detailDesc').textContent = n.description;

  const sourcesList = document.getElementById('sourcesList');
  sourcesList.innerHTML = '';
  (n.sources || []).forEach(sid => {
    const s = SOURCES[sid]; if (!s) return;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = s.u; a.textContent = s.t; a.target = '_blank'; a.rel = 'noopener noreferrer';
    li.appendChild(a); sourcesList.appendChild(li);
  });
  sourcesList.setAttribute('hidden', '');
  document.getElementById('sourcesToggle').setAttribute('aria-expanded', 'false');
  document.getElementById('sourcesToggle').textContent = '資料來源 ▾';

  const panel = document.getElementById('detailPanel');
  const overlay = document.getElementById('detailOverlay');
  panel.classList.add('is-open'); overlay.classList.add('is-open');
  panel.setAttribute('aria-hidden', 'false');
  document.getElementById('detailClose').focus();
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  const panel = document.getElementById('detailPanel');
  const overlay = document.getElementById('detailOverlay');
  panel.classList.remove('is-open'); overlay.classList.remove('is-open');
  panel.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') lastFocusedEl.focus();
}

function initDetailPanel() {
  document.getElementById('detailClose').addEventListener('click', closeDetail);
  document.getElementById('detailOverlay').addEventListener('click', closeDetail);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('detailPanel').classList.contains('is-open')) closeDetail();
  });
  const sourcesToggle = document.getElementById('sourcesToggle');
  sourcesToggle.addEventListener('click', () => {
    const list = document.getElementById('sourcesList');
    const hidden = list.hasAttribute('hidden');
    if (hidden) {
      list.removeAttribute('hidden');
      sourcesToggle.setAttribute('aria-expanded', 'true');
      sourcesToggle.textContent = '資料來源 ▴';
    } else {
      list.setAttribute('hidden', '');
      sourcesToggle.setAttribute('aria-expanded', 'false');
      sourcesToggle.textContent = '資料來源 ▾';
    }
  });
}
</script>

<script>
/* ============================================================
   ACCESSIBILITY & INIT
   ============================================================ */
// 標題列已移除；保留函式以確保手機版 sticky 圖表從畫面頂端開始。
function syncHeaderHeight() {
  const header = document.querySelector('.frame-header');
  document.documentElement.style.setProperty('--header-h', (header ? header.offsetHeight : 0) + 'px');
}

document.addEventListener('DOMContentLoaded', () => {
  initReadingToc();
  initStages();
  initDetailPanel();
  updateReadingToc(0);
  syncHeaderHeight();
  window.addEventListener('resize', syncHeaderHeight);
});
</script>
